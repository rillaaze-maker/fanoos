<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>فانوس</title>
  <meta name="description" content="شیفت‌ها، جابه‌جایی‌ها، و کمی مراقبت از خودت.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F6EFE2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="فانوس">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/DanaFaNum-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/DanaFaNum-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // رنگ را قبل از نمایش تنظیم کن تا چشمک نزند
    try {
      var s = JSON.parse(localStorage.getItem('fanoos.v1') || '{}');
      var d = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <!-- فیلترِ لرزشِ دست برای همه‌ی نقاشی‌ها -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- ردِ دومِ قلم -->
    <filter id="wob2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="G" yChannelSelector="B"/>
    </filter>
    <!-- دو حالتِ دیگر برای «جوشیدنِ» خط، مثل انیمیشن‌های دست‌کشیده -->
    <filter id="wob3" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="B" yChannelSelector="R"/>
    </filter>
    <filter id="wob4" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="88" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <!-- لکه‌ی آبرنگ: لبه‌ی نرم و نامنظم -->
    <filter id="wash" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.7"/>
    </filter>
  </svg>

  <!-- تا برنامه آماده شود: شعله‌ی خواب‌آلود -->
  <div id="boot" class="splash"><div class="sp-flame"><svg class="lantern  m-sleepy" viewBox="0 0 80 90" aria-hidden="true" >
  <g class="body">
  <g class="flame-g" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <g filter="url(#wob)">
      <path class="flame" fill="var(--flame)" stroke="none" d="M40.3 12.6c3.6 9.4 16.4 20.7 16.6 38.1.2 13.5-7.4 23.7-16.8 23.8-9.6.1-17.3-9.6-17.2-22.6.1-9.4 4.4-15.8 8.3-21.3.4 4.6 1.6 8.2 4 10.4-.9-10.6 2.2-19.8 5.1-28.4z"/>
      <path d="M40.3 12.6c3.6 9.4 16.4 20.7 16.6 38.1.2 13.5-7.4 23.7-16.8 23.8-9.6.1-17.3-9.6-17.2-22.6.1-9.4 4.4-15.8 8.3-21.3.4 4.6 1.6 8.2 4 10.4-.9-10.6 2.2-19.8 5.1-28.4z"/>
    </g>
    <g class="ghost" filter="url(#wob2)"><path d="M40.3 12.6c3.6 9.4 16.4 20.7 16.6 38.1.2 13.5-7.4 23.7-16.8 23.8-9.6.1-17.3-9.6-17.2-22.6.1-9.4 4.4-15.8 8.3-21.3.4 4.6 1.6 8.2 4 10.4-.9-10.6 2.2-19.8 5.1-28.4z"/></g>
    <g class="faces" fill="var(--face)" stroke="var(--face)" stroke-width="1.5"><g class="face f-calm"><g class="eyes"><circle cx="34.6" cy="60" r="1.7"/><circle cx="45.4" cy="60" r="1.7"/></g><path fill="none" d="M37.6 65.6c1.6 1.2 3.3 1.2 4.9 0"/></g><g class="face f-soft"><g class="eyes"><circle cx="34.6" cy="60" r="1.7"/><circle cx="45.4" cy="60" r="1.7"/></g><path fill="none" d="M38 66h4"/></g><g class="face f-sleepy"><path fill="none" d="M32.6 60.4c1.3.8 2.7.8 4 0M43.4 60.4c1.3.8 2.7.8 4 0M38.4 66h3.2"/><text class="zz" x="58" y="30">z</text><text class="zz z2" x="65" y="20">z</text></g><g class="face f-happy"><path fill="none" d="M32.4 61c1.1-1.9 3.1-1.9 4.2 0M43.3 61c1.1-1.9 3.1-1.9 4.2 0M36.9 64.8c1.9 2.2 4.3 2.2 6.2 0"/></g><g class="face f-tender"><path fill="none" d="M32.6 59.8c1.3 1.1 2.8 1.1 4 0M43.4 59.8c1.3 1.1 2.8 1.1 4 0M38.2 65.4c1.2.8 2.4.8 3.6 0"/></g></g>
  </g>
  </g>
  <path fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" filter="url(#wob)" d="M28.6 83.4c7.6-.9 15.3-.9 22.9.1"/>
</svg></div></div>

  <main id="view" class="enter"></main>
  <nav class="tabbar" aria-label="بخش‌ها"></nav>
  <div id="onboard" hidden></div>

  <noscript>برای فانوس، جاوااسکریپت لازم است.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
